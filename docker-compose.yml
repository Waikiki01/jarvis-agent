services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped        # up after a reboot, so Claude Desktop / MCP clients work without starting Jarvis
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports: ["5433:5432"]          # 5433 so it never clashes with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      retries: 10
  phoenix:                       # tracing UI: docker compose --profile tracing up -d
    image: arizephoenix/phoenix:version-20.27.0
    profiles: [tracing]
    ports: ["6006:6006"]          # UI + OTLP/HTTP traces at /v1/traces
    volumes: [phoenix:/mnt/data]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
volumes:
  pgdata:
  phoenix:
