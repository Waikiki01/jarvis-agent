[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Personal Jarvis: LangGraph multi-agent assistant with RAG (pgvector) and MCP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2", "langchain-core>=1.8", "langchain-anthropic>=1.7", "langchain-ollama>=1.1",
  "langgraph-checkpoint-postgres>=3.2", "psycopg[binary,pool]>=3.3",
  "fastapi>=0.160", "uvicorn[standard]", "pydantic-settings>=2",
  "pgvector>=0.4", "pypdf>=5", "flashrank>=0.2", "langchain-text-splitters>=1",
  "mcp>=1.30", "langchain-mcp-adapters>=0.3", "mcp-server-fetch",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "pyyaml"]
voice = ["faster-whisper>=1.1"]  # offline speech-to-text for the UI
tracing = ["arize-phoenix-otel==0.17.2", "openinference-instrumentation-langchain==0.1.81"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
