<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23bff4ff'/%3E%3Cstop offset='.55' stop-color='%2333c3ff'/%3E%3Cstop offset='1' stop-color='%23063a5c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%2333c3ff' stroke-width='2' opacity='.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">J.A.R.V.I.S <span class="sub">local agentic assistant</span></div>
    <div class="status">
      <span id="health" class="pill">connecting…</span>
      <label class="toggle"><input type="checkbox" id="speakToggle"> Voice replies</label>
      <label class="toggle"><input type="checkbox" id="morphToggle" checked> Morph</label>
      <button id="newChat" class="ghost" title="Start a new conversation">New chat</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div id="orbLabel" class="orb-label">STANDING BY</div>
      <div id="activity" class="activity" aria-live="polite"></div>
    </section>

    <section class="side">
      <div id="log" class="log" aria-live="polite"></div>

      <div id="approval" class="approval" hidden>
        <div class="approval-title">Approval needed</div>
        <div id="approvalText" class="approval-text"></div>
        <div class="approval-actions">
          <button id="approveBtn" class="ok">Approve <kbd>Y</kbd></button>
          <button id="rejectBtn" class="bad">Reject <kbd>N</kbd></button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <form id="form" autocomplete="off">
      <button type="button" id="mic" class="mic" title="Talk: click, or hold Space (empty input)" aria-label="Talk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>
      <input id="input" placeholder="Ask about your notes, manage tasks, read files…  (hold Space to talk)" autofocus>
      <button type="submit" id="send">Send</button>
    </form>
    <div class="hint" id="hint">Try: "What IP does my printer use?" · "Add a task to renew my passport, due 2027-01-31" · "What's on my shopping list file?"</div>
  </footer>

  <script src="orb.js"></script>
  <script src="app.js"></script>
</body>
</html>
